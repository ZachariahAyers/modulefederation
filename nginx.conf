server {
  listen 80;
  root /usr/share/nginx/html;

  # Remote entries are the deploy boundary: never cache them, so a new
  # release of one app is picked up on the next page load.
  location ~ /remoteEntry\.js$ {
    add_header Cache-Control "no-cache";
  }

  # Everything else a build emits carries a content hash.
  location ~ \.[0-9a-f]{8,}\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
